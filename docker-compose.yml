services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test_project_php
    command: sh -c "composer install --no-interaction --no-progress && php-fpm"
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    networks:
      - appnet

  nginx:
    image: nginx:latest
    container_name: test_project_nginx
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - appnet

  mysql:
    image: mysql:8.0
    container_name: test_project_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet

volumes:
  mysql_data:

networks:
  appnet:
    driver: bridge
